<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>👑 让我们都变成幸福大王 👑</title>
    <style>
        /* ===== 全局华丽可爱风 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Quicksand', 'Segoe UI', 'Poppins', 'Comic Neue', system-ui, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            background: #fce4ec;
            /* 超华丽背景：渐变 + 多层光晕 + 小元素 */
            background-image: 
                radial-gradient(ellipse at 10% 20%, rgba(255, 215, 0, 0.35) 0%, transparent 40%),
                radial-gradient(ellipse at 90% 80%, rgba(255, 100, 200, 0.30) 0%, transparent 45%),
                radial-gradient(ellipse at 30% 70%, rgba(100, 200, 255, 0.25) 0%, transparent 40%),
                radial-gradient(ellipse at 70% 30%, rgba(255, 200, 100, 0.25) 0%, transparent 40%),
                radial-gradient(ellipse at 50% 50%, rgba(255, 220, 240, 0.2) 0%, transparent 60%),
                repeating-linear-gradient(45deg, transparent, transparent 30px, rgba(255, 220, 180, 0.06) 30px, rgba(255, 220, 180, 0.06) 60px),
                repeating-linear-gradient(-45deg, transparent, transparent 30px, rgba(255, 180, 220, 0.05) 30px, rgba(255, 180, 220, 0.05) 60px);
            position: relative;
            overflow-x: hidden;
        }

        /* ===== 漂浮的华丽装饰元素 ===== */
        .floating-deco {
            position: fixed;
            pointer-events: none;
            z-index: 0;
            font-size: 2.2rem;
            opacity: 0.3;
            animation: floatAround 18s ease-in-out infinite alternate;
        }
        .floating-deco:nth-child(1) { top: 5%; left: 3%; animation-duration: 14s; font-size: 2.8rem; }
        .floating-deco:nth-child(2) { top: 12%; right: 5%; animation-duration: 20s; animation-delay: 1s; font-size: 2.2rem; }
        .floating-deco:nth-child(3) { bottom: 18%; left: 6%; animation-duration: 16s; animation-delay: 2s; font-size: 3.0rem; }
        .floating-deco:nth-child(4) { bottom: 8%; right: 4%; animation-duration: 22s; animation-delay: 0.5s; font-size: 2.6rem; }
        .floating-deco:nth-child(5) { top: 45%; left: 2%; animation-duration: 19s; animation-delay: 3s; font-size: 2.0rem; }
        .floating-deco:nth-child(6) { top: 40%; right: 2%; animation-duration: 17s; animation-delay: 1.5s; font-size: 2.4rem; }
        .floating-deco:nth-child(7) { top: 25%; left: 50%; animation-duration: 21s; animation-delay: 0.8s; font-size: 2.0rem; }
        .floating-deco:nth-child(8) { bottom: 30%; right: 10%; animation-duration: 15s; animation-delay: 2.5s; font-size: 2.8rem; }

        @keyframes floatAround {
            0% { transform: translate(0, 0) rotate(0deg) scale(1); }
            25% { transform: translate(15px, -20px) rotate(8deg) scale(1.1); }
            50% { transform: translate(-10px, 15px) rotate(-5deg) scale(0.95); }
            75% { transform: translate(20px, 10px) rotate(6deg) scale(1.05); }
            100% { transform: translate(-5px, -15px) rotate(-3deg) scale(1); }
        }

        /* 顶部滚动装饰条 */
        .top-scroll {
            position: fixed;
            top: 6px;
            left: 0;
            width: 100%;
            font-size: 22px;
            letter-spacing: 14px;
            text-align: center;
            opacity: 0.25;
            pointer-events: none;
            white-space: nowrap;
            overflow: hidden;
            animation: scrollMarquee 22s linear infinite;
            z-index: 0;
        }
        .bottom-scroll {
            position: fixed;
            bottom: 6px;
            left: 0;
            width: 100%;
            font-size: 20px;
            letter-spacing: 12px;
            text-align: center;
            opacity: 0.2;
            pointer-events: none;
            white-space: nowrap;
            overflow: hidden;
            animation: scrollMarquee 25s linear infinite reverse;
            z-index: 0;
        }
        @keyframes scrollMarquee {
            0% { transform: translateX(-8%); }
            100% { transform: translateX(8%); }
        }

        /* ===== 主卡片 ===== */
        .card {
            max-width: 860px;
            width: 100%;
            background: rgba(255, 248, 245, 0.78);
            backdrop-filter: blur(18px);
            border-radius: 90px 40px 90px 40px;
            box-shadow: 0 25px 50px rgba(255, 120, 160, 0.30),
                        0 10px 30px rgba(255, 200, 100, 0.25),
                        inset 0 0 0 3px rgba(255, 255, 255, 0.7),
                        0 0 60px rgba(255, 150, 200, 0.15);
            padding: 38px 32px 42px;
            transition: all 0.2s ease;
            border: 1px solid rgba(255, 220, 180, 0.6);
            position: relative;
            z-index: 2;
            overflow: hidden;
        }

        /* 卡片内华丽装饰 */
        .card::before {
            content: "🌸 ✨ 🍭 🎀 🧁 🍬 🎈 🍉 🧸 🌈 🍧 🎶";
            position: absolute;
            top: -6px;
            right: 8px;
            font-size: 26px;
            opacity: 0.25;
            letter-spacing: 10px;
            white-space: nowrap;
            transform: rotate(4deg);
            pointer-events: none;
        }
        .card::after {
            content: "🐱 🐰 🐼 🐨 🦊 🐻 🐝 🦄 🐳 🐙 🦋 🐞";
            position: absolute;
            bottom: 8px;
            left: 8px;
            font-size: 28px;
            opacity: 0.2;
            letter-spacing: 8px;
            transform: rotate(-3deg);
            pointer-events: none;
        }

        /* ===== 头部 ===== */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px 20px;
            margin-bottom: 20px;
            position: relative;
            z-index: 3;
        }

        .title-group {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .title-group h1 {
            font-size: 2.3rem;
            font-weight: 800;
            background: linear-gradient(135deg, #f57c9f, #ffb07a, #f9d976, #a8e6cf, #7ec8e3);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 4px 20px rgba(255, 150, 100, 0.25);
            letter-spacing: 2px;
            line-height: 1.2;
        }

        .title-emoji {
            font-size: 3.4rem;
            line-height: 1;
            filter: drop-shadow(0 6px 14px rgba(255, 100, 150, 0.35));
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0% { transform: translateY(0px) rotate(0deg) scale(1); }
            50% { transform: translateY(-12px) rotate(6deg) scale(1.05); }
            100% { transform: translateY(0px) rotate(0deg) scale(1); }
        }

        .mode-tabs {
            display: flex;
            gap: 12px;
            background: rgba(255, 220, 200, 0.45);
            padding: 6px 6px;
            border-radius: 60px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.7);
            box-shadow: inset 0 1px 6px rgba(255, 200, 150, 0.3);
            flex-wrap: wrap;
        }

        .mode-btn {
            border: none;
            background: transparent;
            font-size: 1.15rem;
            font-weight: 700;
            padding: 10px 24px;
            border-radius: 50px;
            cursor: pointer;
            transition: 0.25s ease;
            color: #a06b7a;
            display: flex;
            align-items: center;
            gap: 8px;
            letter-spacing: 0.5px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
            white-space: nowrap;
        }

        .mode-btn.active {
            background: #ffd5b3;
            color: #4d2e38;
            box-shadow: 0 8px 20px rgba(255, 150, 100, 0.35), 0 4px 10px rgba(255, 100, 80, 0.2);
            backdrop-filter: blur(4px);
            border: 1px solid #ffe5d0;
            transform: scale(1.03);
        }

        .mode-btn:active { transform: scale(0.94); }

        /* ===== 倒计时盒子 ===== */
        .countdown-box {
            background: rgba(255, 240, 235, 0.55);
            backdrop-filter: blur(8px);
            border-radius: 70px 30px 70px 30px;
            padding: 32px 20px 30px;
            margin: 20px 0 18px;
            box-shadow: inset 0 4px 30px rgba(255, 200, 150, 0.2), 0 12px 40px rgba(255, 150, 100, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.7);
            position: relative;
            z-index: 3;
        }

        .big-emoji {
            font-size: 4.6rem;
            text-align: center;
            margin-bottom: 6px;
            filter: drop-shadow(0 10px 18px rgba(255, 200, 50, 0.3));
            animation: wiggle 2.2s infinite;
        }

        @keyframes wiggle {
            0% { transform: rotate(-3deg) scale(1); }
            50% { transform: rotate(5deg) scale(1.06); }
            100% { transform: rotate(-3deg) scale(1); }
        }

        /* 卡通幸福语句 */
        .happiness-slogan {
            text-align: center;
            font-size: 1.4rem;
            font-weight: 700;
            color: #6b4a4a;
            background: linear-gradient(135deg, #ffd5b3, #ffe5d0);
            padding: 6px 20px;
            border-radius: 60px;
            display: inline-block;
            margin: 0 auto 14px;
            letter-spacing: 1px;
            box-shadow: 0 4px 12px rgba(255, 150, 100, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(2px);
            width: auto;
            max-width: 90%;
        }
        .happiness-slogan span {
            display: inline-block;
            animation: sparkle 1.8s ease-in-out infinite alternate;
        }
        @keyframes sparkle {
            0% { opacity: 0.7; transform: scale(1); }
            100% { opacity: 1; transform: scale(1.02); }
        }

        .time-display {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px 20px;
            font-weight: 700;
            color: #4a2e36;
        }

        .time-unit {
            display: flex;
            align-items: baseline;
            gap: 4px;
            background: rgba(255, 235, 220, 0.6);
            padding: 8px 20px 8px 18px;
            border-radius: 80px;
            backdrop-filter: blur(4px);
            box-shadow: inset 0 1px 8px rgba(255, 200, 150, 0.3);
            border: 1px solid rgba(255, 230, 200, 0.7);
        }

        .time-unit span:first-child {
            font-size: 3.0rem;
            min-width: 76px;
            text-align: center;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #f97f8f, #f9b87a);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 30px rgba(255, 120, 100, 0.2);
        }

        .time-unit .label {
            font-size: 1.05rem;
            font-weight: 600;
            color: #b3847a;
            -webkit-text-fill-color: #b3847a;
            background: none;
            margin-left: 2px;
        }

        .separator {
            font-size: 2.6rem;
            font-weight: 300;
            color: #dbb6aa;
            margin: 0 4px;
        }

        /* ===== 状态栏 ===== */
        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            margin-top: 24px;
            padding: 0 10px;
            gap: 10px;
            position: relative;
            z-index: 3;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 14px;
            background: rgba(255, 225, 200, 0.5);
            backdrop-filter: blur(4px);
            padding: 8px 28px 8px 22px;
            border-radius: 50px;
            border: 1px solid #fff4e8;
            box-shadow: 0 4px 16px rgba(255, 150, 100, 0.1);
        }

        .status-badge span {
            font-size: 2.0rem;
        }

        .status-badge .msg {
            font-weight: 700;
            color: #5f3d47;
            font-size: 1.15rem;
            letter-spacing: 0.5px;
        }

        .progress-emoji {
            font-size: 2.4rem;
            display: flex;
            gap: 2px;
            letter-spacing: 8px;
        }

        /* ===== 底部 ===== */
        .footer-note {
            margin-top: 22px;
            text-align: center;
            font-size: 1.0rem;
            color: #a97a7a;
            font-weight: 600;
            background: rgba(255, 215, 190, 0.3);
            padding: 12px 20px;
            border-radius: 60px;
            backdrop-filter: blur(2px);
            border: 1px solid rgba(255, 235, 200, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
            position: relative;
            z-index: 3;
        }

        .footer-note span {
            font-size: 1.6rem;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 750px) {
            .card { padding: 28px 18px 32px; border-radius: 60px 24px 60px 24px; }
            .title-group h1 { font-size: 1.7rem; }
            .title-emoji { font-size: 2.6rem; }
            .mode-btn { font-size: 0.95rem; padding: 8px 16px; }
            .time-unit span:first-child { font-size: 2.2rem; min-width: 50px; }
            .time-unit { padding: 4px 12px; }
            .separator { font-size: 1.8rem; }
            .big-emoji { font-size: 3.6rem; }
            .status-badge { padding: 6px 18px; }
            .progress-emoji { font-size: 1.8rem; letter-spacing: 4px; }
            .happiness-slogan { font-size: 1.1rem; padding: 4px 16px; }
            .floating-deco { font-size: 1.6rem !important; }
            .top-scroll, .bottom-scroll { font-size: 16px; letter-spacing: 8px; }
        }

        @media (max-width: 480px) {
            .mode-tabs { gap: 4px; justify-content: center; }
            .mode-btn { font-size: 0.78rem; padding: 5px 10px; gap: 4px; }
            .time-display { gap: 4px; }
            .time-unit span:first-child { font-size: 1.6rem; min-width: 34px; }
            .footer-note { font-size: 0.8rem; }
            .title-group h1 { font-size: 1.3rem; }
            .card { padding: 18px 10px 22px; }
            .happiness-slogan { font-size: 0.95rem; }
            .status-badge .msg { font-size: 0.9rem; }
            .status-badge span { font-size: 1.4rem; }
        }
    </style>
</head>
<body>

    <!-- ===== 漂浮华丽装饰 ===== -->
    <div class="floating-deco">🌸</div>
    <div class="floating-deco">🌈</div>
    <div class="floating-deco">🍭</div>
    <div class="floating-deco">🎀</div>
    <div class="floating-deco">🧁</div>
    <div class="floating-deco">🦄</div>
    <div class="floating-deco">🎈</div>
    <div class="floating-deco">🍬</div>

    <!-- 顶部/底部滚动装饰 -->
    <div class="top-scroll">✨ 🍭 🌸 🎀 🧁 🍬 🎈 🍉 🧸 🌈 🍧 🎶 ✨</div>
    <div class="bottom-scroll">🐱 🐰 🐼 🐨 🦊 🐻 🐝 🦄 🐳 🐙 🦋 🐞</div>

    <!-- ===== 主卡片 ===== -->
    <div class="card">
        <div class="header">
            <div class="title-group">
                <span class="title-emoji">👑</span>
                <h1>让我们都变成幸福大王</h1>
                <span style="font-size: 2.2rem; margin-left: -6px;">🌈</span>
            </div>
            <div class="mode-tabs">
                <button class="mode-btn active" id="modeWork" data-mode="work">💼 下班</button>
                <button class="mode-btn" id="modeHoliday" data-mode="holiday">🎉 假期</button>
            </div>
        </div>

        <div class="countdown-box">
            <!-- 中间卡通幸福语句 -->
            <div class="happiness-slogan" id="sloganText">
                <span>✨ 今天也要快乐发光 ✨</span>
            </div>

            <div class="big-emoji" id="mainEmoji">🕔✨</div>
            <div class="time-display" id="timeDisplay">
                <div class="time-unit"><span id="days">00</span><span class="label">天</span></div>
                <span class="separator">·</span>
                <div class="time-unit"><span id="hours">00</span><span class="label">时</span></div>
                <span class="separator">·</span>
                <div class="time-unit"><span id="minutes">00</span><span class="label">分</span></div>
                <span class="separator">·</span>
                <div class="time-unit"><span id="seconds">00</span><span class="label">秒</span></div>
            </div>
        </div>

        <div class="info-row">
            <div class="status-badge">
                <span id="statusEmoji">😎</span>
                <span class="msg" id="statusMsg">今日份快乐</span>
            </div>
            <div class="progress-emoji" id="progressEmojis">
                🌟🌟🌟
            </div>
        </div>

        <div class="footer-note">
            <span>🍭</span> 多巴胺分泌中 · 每天靠近幸福一点点 <span>🍬</span>
            <span style="font-size: 1.4rem;">✨</span>
        </div>
    </div>

    <script>
        (function() {
            // ===== 所有法定节假日 (2026-2028) =====
            const holidayList = [
                { name: '🎆 元旦', date: new Date(2026, 0, 1) },
                { name: '🧧 春节', date: new Date(2026, 1, 17) },
                { name: '🌿 清明节', date: new Date(2026, 3, 5) },
                { name: '💪 劳动节', date: new Date(2026, 4, 1) },
                { name: '🎋 端午节', date: new Date(2026, 5, 19) },
                { name: '🌕 中秋节', date: new Date(2026, 8, 27) },
                { name: '🇨🇳 国庆节', date: new Date(2026, 9, 1) },
                // 2027
                { name: '🎆 元旦', date: new Date(2027, 0, 1) },
                { name: '🧧 春节', date: new Date(2027, 1, 6) },
                { name: '🌿 清明节', date: new Date(2027, 3, 5) },
                { name: '💪 劳动节', date: new Date(2027, 4, 1) },
                { name: '🎋 端午节', date: new Date(2027, 5, 9) },
                { name: '🌕 中秋节', date: new Date(2027, 8, 15) },
                { name: '🇨🇳 国庆节', date: new Date(2027, 9, 1) },
                // 2028
                { name: '🎆 元旦', date: new Date(2028, 0, 1) },
                { name: '🧧 春节', date: new Date(2028, 1, 26) },
                { name: '🌿 清明节', date: new Date(2028, 3, 4) },
                { name: '💪 劳动节', date: new Date(2028, 4, 1) },
            ];

            function getNextHoliday() {
                const now = new Date();
                const future = holidayList
                    .filter(item => item.date.getTime() > now.getTime())
                    .sort((a, b) => a.date.getTime() - b.date.getTime());
                if (future.length > 0) return future[0];
                return { name: '🎉 明年假期', date: new Date(2028, 9, 1) };
            }

            let currentHoliday = getNextHoliday();

            // DOM
            const daysEl = document.getElementById('days');
            const hoursEl = document.getElementById('hours');
            const minutesEl = document.getElementById('minutes');
            const secondsEl = document.getElementById('seconds');
            const mainEmoji = document.getElementById('mainEmoji');
            const statusEmoji = document.getElementById('statusEmoji');
            const statusMsg = document.getElementById('statusMsg');
            const progressEmojis = document.getElementById('progressEmojis');
            const sloganText = document.getElementById('sloganText');

            const modeWorkBtn = document.getElementById('modeWork');
            const modeHolidayBtn = document.getElementById('modeHoliday');
            
            let currentMode = 'work';

            // 下班目标: 每天 17:00:00 (五点)
            function getWorkTarget() {
                const now = new Date();
                const target = new Date(now);
                target.setHours(17, 0, 0, 0);
                if (now.getTime() >= target.getTime()) {
                    target.setDate(target.getDate() + 1);
                }
                return target;
            }

            // ===== 卡通幸福语句池 =====
            const sloganPool = [
                '✨ 今天也要快乐发光 ✨',
                '🌈 幸福正在赶来的路上 🌈',
                '🍭 每天都是甜甜的一天 🍭',
                '🌸 保持可爱，世界也会爱你 🌸',
                '🎀 做自己的小太阳 🎀',
                '🧁 生活很苦，但你要甜 🧁',
                '🦄 相信魔法，相信奇迹 🦄',
                '🍬 把日子过成糖 🍬',
                '🌟 你值得所有的美好 🌟',
                '🎈 向着幸福飞吧 🎈',
            ];
            let sloganIndex = 0;

            function updateSlogan() {
                // 随机切换或顺序切换，这里用随机
                const randomIdx = Math.floor(Math.random() * sloganPool.length);
                sloganText.innerHTML = `<span>✨ ${sloganPool[randomIdx]} ✨</span>`;
            }

            function updateCountdown() {
                const now = new Date();
                let target;
                let modeDisplayName = '';

                if (currentMode === 'work') {
                    target = getWorkTarget();
                    modeDisplayName = '下班';
                } else {
                    if (now.getTime() >= currentHoliday.date.getTime()) {
                        currentHoliday = getNextHoliday();
                    }
                    target = currentHoliday.date;
                    modeDisplayName = currentHoliday.name;
                }

                let diff = target.getTime() - now.getTime();
                if (diff < 0) diff = 0;

                const secondsTotal = Math.floor(diff / 1000);
                const days = Math.floor(secondsTotal / 86400);
                const hours = Math.floor((secondsTotal % 86400) / 3600);
                const minutes = Math.floor((secondsTotal % 3600) / 60);
                const seconds = secondsTotal % 60;

                daysEl.textContent = String(days).padStart(2, '0');
                hoursEl.textContent = String(hours).padStart(2, '0');
                minutesEl.textContent = String(minutes).padStart(2, '0');
                secondsEl.textContent = String(seconds).padStart(2, '0');

                // ---- 多巴胺 卡哇伊 表情 ----
                if (currentMode === 'work') {
                    if (diff === 0) {
                        mainEmoji.textContent = '🎉🥳 下班啦!';
                    } else {
                        mainEmoji.textContent = '🕔✨';
                    }
                } else {
                    if (diff === 0) {
                        mainEmoji.textContent = '🏖️🎉 假期开始!';
                    } else {
                        mainEmoji.textContent = '🌈🎈';
                    }
                }

                if (currentMode === 'work') {
                    if (diff === 0) {
                        statusEmoji.textContent = '🥳';
                        statusMsg.textContent = '下班快乐！幸福大王！';
                    } else if (hours < 1 && days === 0) {
                        statusEmoji.textContent = '⏳';
                        statusMsg.textContent = '马上就可以冲了！';
                    } else if (days === 0 && hours < 3) {
                        statusEmoji.textContent = '🔥';
                        statusMsg.textContent = '再坚持一下下！';
                    } else {
                        statusEmoji.textContent = '😎';
                        statusMsg.textContent = '加油打工人！';
                    }
                } else {
                    if (diff === 0) {
                        statusEmoji.textContent = '🎊';
                        statusMsg.textContent = '假期快乐！！';
                    } else if (days <= 3) {
                        statusEmoji.textContent = '🤩';
                        statusMsg.textContent = `${currentHoliday.name} 快到啦！`;
                    } else if (days <= 10) {
                        statusEmoji.textContent = '🌟';
                        statusMsg.textContent = `期待 ${currentHoliday.name}`;
                    } else {
                        statusEmoji.textContent = '🌸';
                        statusMsg.textContent = `距离 ${currentHoliday.name} 还有...`;
                    }
                }

                // 进度小表情
                let progressStr = '';
                if (currentMode === 'work') {
                    const totalWorkSeconds = 8 * 3600; // 9:00 ~ 17:00
                    const elapsed = (now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds()) - 9 * 3600;
                    const p = Math.min(1, Math.max(0, elapsed / totalWorkSeconds));
                    const starCount = Math.floor(p * 5);
                    progressStr = '⭐'.repeat(starCount) + '☆'.repeat(5 - starCount);
                    if (diff === 0) progressStr = '🌈🎉🎉';
                } else {
                    const totalDays = 30;
                    const remainDays = Math.floor(diff / 86400000);
                    const starCount = Math.max(0, Math.min(5, Math.floor((1 - remainDays / totalDays) * 5)));
                    progressStr = '🌟'.repeat(starCount) + '✨'.repeat(5 - starCount);
                    if (diff === 0) progressStr = '🎉🎉🎉';
                }
                progressEmojis.textContent = progressStr || '🌟🌟🌟';

                if (diff === 0 && currentMode === 'work') {
                    statusMsg.textContent = '🎈 去享受生活吧！';
                }
                if (diff === 0 && currentMode === 'holiday') {
                    statusMsg.textContent = '🎈 假期开启！';
                }

                // 更新卡通语句 (每10秒换一次，在setInterval里控制)
            }

            function setMode(mode) {
                currentMode = mode;
                if (mode === 'work') {
                    modeWorkBtn.classList.add('active');
                    modeHolidayBtn.classList.remove('active');
                } else {
                    modeHolidayBtn.classList.add('active');
                    modeWorkBtn.classList.remove('active');
                    currentHoliday = getNextHoliday();
                }
                updateCountdown();
                // 切换时换一句slogan
                updateSlogan();
            }

            // 事件绑定
            modeWorkBtn.addEventListener('click', () => setMode('work'));
            modeHolidayBtn.addEventListener('click', () => setMode('holiday'));

            // 每秒更新倒计时
            setInterval(updateCountdown, 1000);
            updateCountdown();

            // 每8秒换一次卡通语句 & 刷新假期
            setInterval(() => {
                updateSlogan();
                if (currentMode === 'holiday') {
                    const now = new Date();
                    if (now.getTime() >= currentHoliday.date.getTime()) {
                        currentHoliday = getNextHoliday();
                        updateCountdown();
                    }
                }
            }, 8000);

            // 页面可见性变化时刷新
            document.addEventListener('visibilitychange', function() {
                if (!document.hidden) {
                    if (currentMode === 'holiday') {
                        currentHoliday = getNextHoliday();
                    }
                    updateCountdown();
                    updateSlogan();
                }
            });

            console.log('👑 让我们都变成幸福大王！ (华丽五点下班版)');
        })();
    </script>
</body>
</html>
